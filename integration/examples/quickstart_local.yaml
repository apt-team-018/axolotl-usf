# Quickstart Example - Local Testing
# Use this for testing the system on your local machine
#
# Requirements:
# - 1 GPU with 8GB+ VRAM
# - Dataset in OpenAI format at specified path
#
# Run: python integration/train_wrapper.py --job-config integration/examples/quickstart_local.yaml

job_id: "quickstart-local-test"
model: "NousResearch/Llama-3.2-1B"  # Small model for quick testing
training_type: "qlora"

# Hardware (adjust to your setup)
nodes: 1
gpus_per_node: 1

# Storage (local filesystem - easiest for testing)
storage:
  type: "filesystem"
  dataset_uri: "/data/test_conversations.jsonl"  # UPDATE THIS PATH
  output_uri: "/tmp/axolotl_output"

# Monitoring (TensorBoard only - no signup required)
monitoring:
  tensorboard:
    log_dir: "./runs"

# Hyperparameters (optimized for quick testing)
hyperparameters:
  # Dataset
  sequence_len: 512  # Short sequences for speed
  sample_packing: true
  pad_to_sequence_len: true

  # Batch size
  micro_batch_size: 2
  gradient_accumulation_steps: 2

  # Learning
  learning_rate: 3e-4
  num_epochs: 1
  max_steps: 20  # Just 20 steps for testing

  # LoRA
  lora_r: 8  # Small rank for speed
  lora_alpha: 16
  lora_dropout: 0.05
  lora_target_linear: true

  # Optimizer
  optimizer: "paged_adamw_8bit"

  # Precision
  bf16: auto
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  flash_attention: true

  # Evaluation
  val_set_size: 0.1
  logging_steps: 1
  saves_per_epoch: 1

output_dir: "/tmp/axolotl_output"
